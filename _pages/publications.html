---
layout: archive
title: "Publications"
permalink: /publications/
author_profile: true
---

{% for post in site.publications reversed %}
  <div style="margin-bottom: 30px;">
    <p style="margin-bottom: 5px;">
      <a href="{{ post.paperurl }}">{{ post.title }}</a>
    </p>
    {% if post.excerpt %}
      <p style="font-size: 0.9em;">{{ post.excerpt }}</p>
    {% endif %}
  </div>
{% endfor %}
